{% extends "base.html" %}
{% block content %}
<div class="flex gap-2 items-center mb-4">
    <input class="input input-lg flex-1" id="busca" placeholder="Buscar compra...">
    <button class="btn btn-primary" onclick="abrirModal()">+ Nova Compra</button>
</div>
<div class="tabela-wrap">
    <table class="tabela"><thead><tr><th>ID</th><th>Fornecedor</th><th>Total</th><th>Itens</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>
<div class="modal modal-lg" id="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Nova Compra</h3>
        <input type="hidden" id="editId">
        <div class="form-group"><label>Fornecedor</label><select class="input w-full" id="fFornecedor"></select></div>
        <div class="form-group"><label>Observação</label><input class="input w-full" id="fObs"></div>
        <div class="form-group"><label>Itens</label>
            <table class="tabela" id="tabelaItens"><thead><tr><th>Produto</th><th>Qtd</th><th>Preço Unit.</th><th>Total</th><th></th></tr></thead>
                <tbody id="tbodyItens"></tbody>
            </table>
            <button class="btn btn-sm btn-outline mt-2" onclick="addItem()">+ Adicionar Item</button>
        </div>
        <div class="flex items-center justify-between mt-4">
            <strong>Total: <span id="totalCompra">0,00 MT</span></strong>
            <div class="flex gap-2">
                <button class="btn btn-success" onclick="salvar()">💾 Salvar</button>
                <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let dados = [], fornecedores = [], produtos = [];
let itens = [];

function carregar() {
    fetch('/api/compras').then(r=>r.json()).then(d=>{dados=d;render('');});
    fetch('/api/fornecedores').then(r=>r.json()).then(d=>{fornecedores=d;
        const sel=document.getElementById('fFornecedor');
        sel.innerHTML='<option value="">Selecione</option>';
        d.forEach(f=>{sel.innerHTML+=`<option value="${f.id}">${f.nome}</option>`;});
    });
    fetch('/api/produtos').then(r=>r.json()).then(d=>{produtos=d;});
}
function render(b) {
    const tbody = document.getElementById('tbody');
    const busca = (b||'').toLowerCase();
    tbody.innerHTML = '';
    dados.filter(c => !busca || (c.fornecedor||'').toLowerCase().includes(busca)).forEach(c => {
        tbody.innerHTML += `<tr>
            <td>${c.id}</td><td>${c.fornecedor||'-'}</td><td>${moeda(c.total)}</td>
            <td>${c.total_itens||'-'}</td>
            <td><span class="tag tag-${c.status=='recebido'?'success':c.status=='cancelada'?'danger':'info'}">${c.status}</span></td>
            <td>${c.data_pedido||'-'}</td>
            <td>
                ${c.status=='pendente'?`<button class="btn btn-sm btn-outline" onclick="editar(${c.id})" title="Editar">✏️</button> <button class="btn btn-sm btn-success" onclick="receber(${c.id})">Receber</button> <button class="btn btn-sm btn-danger" onclick="excluir(${c.id})" title="Cancelar">🗑️</button>`:''}
                ${c.status=='recebido'?`<button class="btn btn-sm btn-outline" onclick="ver(${c.id})" title="Ver">👁️</button>`:''}
            </td>
        </tr>`;
    });
}
function abrirModal(d) {
    itens = [];
    document.getElementById('editId').value = d ? d.id : '';
    document.getElementById('fFornecedor').value = d ? (d.fornecedor_id||'') : '';
    document.getElementById('fObs').value = d ? (d.observacao||'') : '';
    document.getElementById('modalTitle').textContent = d ? 'Editar Compra' : 'Nova Compra';
    renderItens();
    document.getElementById('modal').classList.add('open');
}
function fecharModal() { document.getElementById('modal').classList.remove('open'); }
function renderItens() {
    const tbody = document.getElementById('tbodyItens');
    tbody.innerHTML = '';
    let total = 0;
    itens.forEach((item, i) => {
        const totalItem = (parseFloat(item.quantidade)||0) * (parseFloat(item.preco_unitario)||0);
        total += totalItem;
        tbody.innerHTML += `<tr>
            <td><select class="input w-full" onchange="itens[${i}].produto_id=parseInt(this.value);atualizarTotal()">
                <option value="">Selecione</option>
                ${produtos.map(p => `<option value="${p.id}" ${p.id==item.produto_id?'selected':''}>${p.nome}${p.codigo_barras?' ('+p.codigo_barras+')':''}</option>`).join('')}
            </select></td>
            <td><input class="input w-full" type="number" step="0.01" value="${item.quantidade||''}" onchange="itens[${i}].quantidade=parseFloat(this.value)||0;atualizarTotal()"></td>
            <td><input class="input w-full" type="number" step="0.01" value="${item.preco_unitario||''}" onchange="itens[${i}].preco_unitario=parseFloat(this.value)||0;atualizarTotal()"></td>
            <td>${moeda(totalItem)}</td>
            <td><button class="btn btn-sm btn-danger" onclick="removerItem(${i})">✕</button></td>
        </tr>`;
    });
    document.getElementById('totalCompra').textContent = moeda(total);
}
function atualizarTotal() { renderItens(); }
function addItem() {
    itens.push({produto_id:0, quantidade:1, preco_unitario:0});
    renderItens();
}
function removerItem(i) {
    itens.splice(i, 1);
    renderItens();
}
function salvar() {
    const id = document.getElementById('editId').value;
    const data = {fornecedor_id:parseInt(document.getElementById('fFornecedor').value)||null,
        itens: itens.filter(i => i.produto_id && i.quantidade > 0),
        observacao:document.getElementById('fObs').value.trim()};
    if (!data.fornecedor_id) { notif('Selecione fornecedor!',true); return; }
    if (!data.itens.length) { notif('Adicione ao menos 1 item!',true); return; }
    const url = id ? '/api/compras/'+id : '/api/compras';
    const method = id ? 'PUT' : 'POST';
    fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json()).then(res => { if(res.ok || res.id) { notif(id?'Compra atualizada!':'Compra criada!'); fecharModal(); carregar(); } });
}
function editar(id) {
    fetch('/api/compras/'+id).then(r=>r.json()).then(res => {
        if (res.compra) {
            itens = (res.itens||[]).map(i => ({produto_id:i.produto_id, quantidade:i.quantidade, preco_unitario:i.preco_unitario}));
            abrirModal(res.compra);
        }
    });
}
function ver(id) {
    fetch('/api/compras/'+id).then(r=>r.json()).then(res => {
        if (res.compra) {
            itens = (res.itens||[]).map(i => ({produto_id:i.produto_id, quantidade:i.quantidade, preco_unitario:i.preco_unitario}));
            abrirModal(res.compra);
            document.querySelectorAll('#modal input, #modal select, #modal button:not(.btn-outline)').forEach(el => el.disabled = true);
        }
    });
}
function receber(id) {
    fetch('/api/compras/'+id+'/receber',{method:'POST'}).then(r=>r.json()).then(res => {
        if(res.ok) { notif('Compra recebida!'); carregar(); }
    });
}
function excluir(id) {
    if (!confirm('Cancelar esta compra?')) return;
    fetch('/api/compras/'+id,{method:'DELETE'}).then(r=>r.json()).then(res => {
        if(res.ok) { notif('Compra cancelada!'); carregar(); }
    });
}
document.getElementById('busca').addEventListener('input',e=>render(e.target.value));
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharModal();});
carregar();
</script>
{% endblock %}
