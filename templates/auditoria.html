{% extends "base.html" %}
{% block content %}
<div class="page-hero card card-accent mb-4">
    <div class="page-hero-inner">
        <div>
            <p class="eyebrow">Segurança</p>
            <h1>Auditoria</h1>
            <p class="hero-subtitle">Registo detalhado de todas as acções realizadas no sistema.</p>
        </div>
        <div class="hero-value">
            <span class="hero-value-title">Acções hoje</span>
            <div class="hero-value-number" id="totalHoje">—</div>
        </div>
    </div>
</div>

<div class="flex gap-2 items-center mb-4">
    <input class="input input-lg flex-1" id="busca" placeholder="Filtrar por entidade...">
    <select class="input" id="filtroEntidade">
        <option value="">Todas entidades</option>
        <option value="produto">Produtos</option>
        <option value="cliente">Clientes</option>
        <option value="fornecedor">Fornecedores</option>
        <option value="utilizador">Utilizadores</option>
        <option value="filial">Filiais</option>
        <option value="compra">Compras</option>
        <option value="documento_fiscal">Documentos Fiscais</option>
        <option value="funcionario">Funcionários</option>
    </select>
    <button class="btn btn-outline" onclick="carregar()">🔄 Atualizar</button>
</div>
<div class="tabela-wrap">
    <table class="tabela"><thead><tr><th>Data</th><th>Utilizador</th><th>Ação</th><th>Entidade</th><th>ID</th><th>Detalhes</th><th>IP</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script>
let logs = [];
function carregar() {
    const entidade = document.getElementById('filtroEntidade').value;
    const url = '/api/auditoria' + (entidade ? '?entidade='+entidade : '');
    fetch(url).then(r=>r.json()).then(d=>{logs=d;render();});
    fetch('/api/auditoria/resumo').then(r=>r.json()).then(r=>{
        document.getElementById('totalHoje').textContent = r.hoje || 0;
    });
}
function render() {
    const busca = document.getElementById('busca').value.toLowerCase();
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = logs.filter(l => !busca || (l.entidade||'').includes(busca) || (l.acao||'').includes(busca) || (l.utilizador_nome||'').toLowerCase().includes(busca))
    .map(l => `<tr>
        <td class="text-sm">${l.data}</td>
        <td><strong>${l.utilizador_nome||'-'}</strong></td>
        <td><span class="tag tag-${l.acao.startsWith('criar')?'success':l.acao.startsWith('excluir')||l.acao.startsWith('anular')?'danger':'info'}">${l.acao}</span></td>
        <td>${l.entidade||'-'}</td>
        <td>${l.entidade_id||'-'}</td>
        <td class="text-sm">${l.detalhes||'-'}</td>
        <td class="text-sm">${l.ip||'-'}</td>
    </tr>`).join('');
}
document.getElementById('busca').addEventListener('input', render);
document.getElementById('filtroEntidade').addEventListener('change', carregar);
carregar();
</script>
{% endblock %}
